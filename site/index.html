<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireSET fuel-type EDA</title>
<meta name="description" content="Interactive dashboard over the FireSET fuel-type EDA for California: LANDFIRE FBFM13/FBFM40 releases, the fuel crosswalk, FEMS reading counts, cross-product matrices and release-to-release change.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232a78d6'/%3E%3Cpath d='M4 11h2V7H4zm3 0h2V4H7zm3 0h2V6h-2z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly.min.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <div class="title">FireSET fuel-type EDA</div>
      <div class="subtitle" id="built-from">California · LANDFIRE FBFM13 / FBFM40 × FEMS</div>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="tools">
    <label class="theme-toggle" title="Colour scheme">
      <span class="sr-only">Theme</span>
      <select id="theme">
        <option value="auto">Auto</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </div>
</header>

<main id="main">
  <section id="loading" class="panel">
    <p class="muted">Loading catalogue…</p>
  </section>
  <section id="view" hidden></section>
</main>

<footer class="foot">
  <span>Built from the FireSET EDA outputs (CSV + SVG only). Every chart is drawn in the browser from the CSV it links to.</span>
  <span><a href="data/README.md">README</a> · <a href="data/manifest.json">manifest.json</a> · <a href="https://github.com/utkrshkmr/FEMS">source</a></span>
</footer>

<script src="app.js"></script>
</body>
</html>
